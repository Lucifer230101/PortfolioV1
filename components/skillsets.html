<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skillsets</title>
</head>

<body>
    <section class="skills-section">

            <h2>Technical Skills</h2>
        <p class="skills-subtitle">
            Technologies I use to build modern applications.
            </p>

        <div class="orbit-container">

            <div class="center-circle">
                <span>SG</span>
            </div>

            <!-- Ring 1 -->
            <div class="orbit orbit1">
                <div class="skill" data-name="HTML"><i class="devicon-html5-plain colored"></i></div>
                <div class="skill" data-name="CSS"><i class="devicon-css3-plain colored"></i></div>
                <div class="skill" data-name="JavaScript"><i class="devicon-javascript-plain colored"></i></div>
                <div class="skill" data-name="React"><i class="devicon-react-original colored"></i></div>
                <div class="skill" data-name="Next.js"><i class="devicon-nextjs-plain"></i></div>
            </div>

            <!-- Ring 2 -->
            <div class="orbit orbit2">
                <div class="skill" data-name="Node.js"><i class="devicon-nodejs-plain colored"></i></div>
                <div class="skill" data-name="Java"><i class="devicon-java-plain colored"></i></div>
                <div class="skill" data-name="MongoDB"><i class="devicon-mongodb-plain colored"></i></div>
                <div class="skill" data-name="MySQL"><i class="devicon-mysql-original colored"></i></div>
            </div>

            <!-- Ring 3 -->
            <div class="orbit orbit3">
                <div class="skill" data-name="Unity"><i class="devicon-unity-plain"></i></div>
                <div class="skill" data-name="Blender"><i class="devicon-blender-original colored"></i></div>
                <div class="skill" data-name="Verge3D">V3D</div>
                <div class="skill" data-name="C#"><i class="devicon-csharp-plain colored"></i></div>
                <div class="skill" data-name="Prompt Engineering">AI</div>
                <div class="skill" data-name="AI Workflow Development">🤖</div>
            </div>

        </div>

    </section>
</body>

</html>
